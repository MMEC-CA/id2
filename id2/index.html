<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plane Landing Game</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #87CEEB;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        canvas {
            display: block;
        }
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 15px;
            border-radius: 8px;
            pointer-events: none;
            min-width: 200px;
        }
        .stat {
            margin-bottom: 5px;
            display: flex;
            justify-content: space-between;
        }
        .stat span {
            font-weight: bold;
            color: #4CAF50;
        }
        #message {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.85);
            color: white;
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            display: none;
        }
        #message h1 { margin-top: 0; }
        #message button {
            background: #4CAF50;
            border: none;
            color: white;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            margin-top: 15px;
        }
        #message button:hover { background: #45a049; }
        #controls-hint {
            position: absolute;
            bottom: 20px;
            left: 20px;
            color: white;
            background: rgba(0,0,0,0.5);
            padding: 10px;
            border-radius: 5px;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div id="ui">
        <div class="stat">Altitude: <span id="alt">0</span> m</div>
        <div class="stat">Airspeed: <span id="spd">0</span> km/h</div>
        <div class="stat">Vertical Spd: <span id="vspd">0</span> m/s</div>
        <div class="stat">Throttle: <span id="thr">0</span>%</div>
        <div class="stat">Pitch: <span id="pitch">0</span>°</div>
    </div>

    <div id="controls-hint">
        Arrows: Up/Down = Pitch, Left/Right = Throttle
    </div>

    <div id="message">
        <h1 id="msg-title">Landed!</h1>
        <p id="msg-body">Perfect landing.</p>
        <button onclick="resetGame()">Try Again</button>
    </div>

    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const uiAlt = document.getElementById('alt');
        const uiSpd = document.getElementById('spd');
        const uiVSpd = document.getElementById('vspd');
        const uiThr = document.getElementById('thr');
        const uiPitch = document.getElementById('pitch');
        const msgOverlay = document.getElementById('message');
        const msgTitle = document.getElementById('msg-title');
        const msgBody = document.getElementById('msg-body');

        // Game Constants
        const GRAVITY = 0.15;
        const LIFT_COEFF = 0.012;
        const DRAG_COEFF = 0.005;
        const THRUST_POWER = 0.4;
        const RUNWAY_Y = 0.9; // 90% down the screen

        let plane = {
            x: 100,
            y: 200,
            vx: 5,
            vy: 0,
            angle: 0, // Radians
            thrust: 0.5, // 0 to 1
            width: 40,
            height: 15,
            dead: false,
            landed: false
        };

        let keys = {};
        window.addEventListener('keydown', e => keys[e.code] = true);
        window.addEventListener('keyup', e => keys[e.code] = false);

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        function resetGame() {
            plane = {
                x: 100,
                y: 150,
                vx: 6,
                vy: 0,
                angle: 0,
                thrust: 0.5,
                width: 40,
                height: 15,
                dead: false,
                landed: false
            };
            msgOverlay.style.display = 'none';
            requestAnimationFrame(update);
        }

        function update() {
            if (plane.dead || plane.landed) return;

            // Input Handling
            if (keys['ArrowUp']) plane.angle -= 0.03;
            if (keys['ArrowDown']) plane.angle += 0.03;
            if (keys['ArrowLeft']) plane.thrust = Math.max(0, plane.thrust - 0.01);
            if (keys['ArrowRight']) plane.thrust = Math.min(1, plane.thrust + 0.01);

            // Keep angle in check
            plane.angle = Math.max(-Math.PI/4, Math.min(Math.PI/4, plane.angle));

            // Physics Logic
            const speed = Math.sqrt(plane.vx * plane.vx + plane.vy * plane.vy);
            
            // Forces
            const thrustX = Math.cos(plane.angle) * plane.thrust * THRUST_POWER;
            const thrustY = Math.sin(plane.angle) * plane.thrust * THRUST_POWER;
            
            // Lift is proportional to speed squared and angle of attack
            // Simplified: Lift acts perpendicular to movement or just "up"
            const lift = speed * speed * LIFT_COEFF * (Math.max(0, -plane.angle + 0.1));
            const drag = speed * speed * DRAG_COEFF;

            // Update Velocity
            plane.vx += thrustX - (plane.vx / speed) * drag;
            plane.vy += thrustY + GRAVITY - lift;

            // Update Position
            plane.x += plane.vx;
            plane.y += plane.vy;

            // Loop plane or scroll? Let's just wrap for now but focus on landing
            if (plane.x > canvas.width) plane.x = -plane.width;

            // Ground Collision
            const groundY = canvas.height * RUNWAY_Y;
            if (plane.y + plane.height/2 >= groundY) {
                plane.y = groundY - plane.height/2;
                checkLanding();
            }

            draw();
            updateUI();
            requestAnimationFrame(update);
        }

        function checkLanding() {
            const verticalSpeed = Math.abs(plane.vy);
            const horizontalSpeed = plane.vx;
            const pitch = Math.abs(plane.angle * (180 / Math.PI));

            // Landing criteria
            if (verticalSpeed < 1.5 && pitch < 10 && horizontalSpeed < 10) {
                plane.landed = true;
                showMessage("Landed Safely!", "Smooth touchdown, Captain.");
            } else {
                plane.dead = true;
                showMessage("CRASHED!", `Hard impact! V-Speed: ${verticalSpeed.toFixed(1)}, Pitch: ${pitch.toFixed(1)}°`);
            }
        }

        function showMessage(title, body) {
            msgTitle.innerText = title;
            msgBody.innerText = body;
            msgOverlay.style.display = 'block';
        }

        function updateUI() {
            const groundY = canvas.height * RUNWAY_Y;
            uiAlt.innerText = Math.max(0, Math.floor((groundY - plane.y) / 2));
            uiSpd.innerText = Math.floor(plane.vx * 20);
            uiVSpd.innerText = (-plane.vy).toFixed(1);
            uiThr.innerText = Math.floor(plane.thrust * 100);
            uiPitch.innerText = (-plane.angle * (180 / Math.PI)).toFixed(0);
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw Sky (Gradient)
            const sky = ctx.createLinearGradient(0, 0, 0, canvas.height);
            sky.addColorStop(0, '#1E90FF');
            sky.addColorStop(1, '#87CEEB');
            ctx.fillStyle = sky;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw Ground/Runway
            const groundY = canvas.height * RUNWAY_Y;
            ctx.fillStyle = '#333'; // Runway
            ctx.fillRect(0, groundY, canvas.width, canvas.height - groundY);
            
            // Runway Markings
            ctx.strokeStyle = 'white';
            ctx.setLineDash([30, 20]);
            ctx.beginPath();
            ctx.moveTo(0, groundY + 5);
            ctx.lineTo(canvas.width, groundY + 5);
            ctx.stroke();
            ctx.setLineDash([]);

            // Draw Plane
            ctx.save();
            ctx.translate(plane.x, plane.y);
            ctx.rotate(plane.angle);

            // Plane Body
            ctx.fillStyle = 'white';
            ctx.fillRect(-plane.width/2, -plane.height/2, plane.width, plane.height);
            
            // Cockpit
            ctx.fillStyle = '#ADD8E6';
            ctx.fillRect(plane.width/4, -plane.height/2, plane.width/4, plane.height/2);
            
            // Tail
            ctx.fillStyle = 'white';
            ctx.beginPath();
            ctx.moveTo(-plane.width/2, -plane.height/2);
            ctx.lineTo(-plane.width/2 - 10, -plane.height/2 - 10);
            ctx.lineTo(-plane.width/2, -plane.height/2 - 10);
            ctx.closePath();
            ctx.fill();

            // Wings
            ctx.fillStyle = '#ddd';
            ctx.fillRect(-5, 0, 10, 20); // Static wing for 2D look

            ctx.restore();
        }

        update();
    </script>
</body>
</html>
